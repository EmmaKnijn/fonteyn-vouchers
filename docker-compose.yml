version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: fonteyn_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fonteyn_vouchers
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: fonteyn_backend
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
    ports:
      - "3000:3000"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
    container_name: fonteyn_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
